# These are Hurricane's obstacle designs, not a calibrated course map.
# Capture the obstacle beginnings and the course +x axis before hardware use.
# Source trans.py reflects y; info_transmiting.py also negates controller yaw.
# Therefore ROS local target = [source_x, -source_y, -radians(source_yaw)].
# origin is [map_x, map_y, course_axis_yaw_radians].  Targets keep source units:
# x/y in metres, yaw in degrees.  null captures the value at waypoint entry.
# Each mode/jump has its own feedback step.  min_wait never proves completion.
# The source's literal yaw=None disables final heading acceptance only for
# bridge_a's first waypoint; require_yaw:false preserves that distinction.
# Every jump repeats its source mode preparation, even if unchanged.
# The source's immediate post-jump stand writes are replaced by completion
# and safe-landing feedback; this is not a claim of identical firmware timing.
version: 1
coordinate_convention: hurricane_reflected_y
skills:
  bridge_a:
    name: 木桥A
    calibrated: false
    origin: [3.42, 0.0, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_bridge_A
      begin: [3.42, 0.0]
      note: 原 handler 名称与使用的木桥B模式交叉，保留实际动作和模式设计。
    steps:
      - {type: mode, command: 小斜坡模式, min_wait: 1.0}
      - {type: waypoint, target: [1.8, 0.0, null], require_yaw: false}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [null, null, -90.0]}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: waypoint, target: [null, -0.35, -90.0], yaw_tolerance_deg: 2.0}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: waypoint, target: [null, -1.32, -90.0], yaw_tolerance_deg: 2.0}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: waypoint, target: [null, -2.47, -90.0], yaw_tolerance_deg: 2.0}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: waypoint, target: [null, -3.10, -90.0], yaw_tolerance_deg: 2.0}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: jump, command: 小跳2, min_wait: 5.0}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [null, null, -180.0], yaw_tolerance_deg: 2.0}
      # Original final two targets use the configured bridge_B beginning.
      - {type: waypoint, target: [0.5, -4.08, 180.0], anchor_skill: bridge_b, anchor_offset: [0.5, 0.05]}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: waypoint, target: [0.0, -4.08, 180.0], yaw_tolerance_deg: 1.0, anchor_skill: bridge_b, anchor_offset: [0.0, 0.05]}

  bridge_b:
    name: 木桥B
    calibrated: false
    origin: [3.42, 4.13, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_bridge_B
      begin: [3.42, -4.13]
      note: 原 handler 使用木桥A模式，保留该模式编号。
    steps:
      - {type: mode, command: 木桥A模式, min_wait: 1.0}
      - {type: waypoint, target: [-2.0, 0.05, -180.0], yaw_tolerance_deg: 2.0}
      - {type: waypoint, target: [-2.5, 0.1, -180.0], yaw_tolerance_deg: 1.0}

  big_slope:
    name: 大斜坡
    calibrated: false
    origin: [1.05, 3.98, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_big_slope
      begin: [1.05, -3.98]
      note: 原固定左转/右转覆盖会绕过几何误差判断，移植后按ROS误差转向。
    steps:
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: waypoint, target: [0.2, 0.0, -180.0]}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: mode, command: 大斜坡模式, min_wait: 1.0}
      - {type: waypoint, target: [null, null, 90.0], source_motion_override: 左转}
      - {type: waypoint, target: [null, 1.0, null], drive_direction: reverse, source_motion_override: 后退}
      - {type: waypoint, target: [null, null, -180.0], source_motion_override: 右转}
      - {type: waypoint, target: [-2.9, null, null], source_motion_override: 前进}
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [-3.0, 0.0, -180.0]}

  limit_pole:
    name: 限高栏
    calibrated: false
    origin: [-2.95, 3.98, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_limit_pole
      begin: [-2.95, -3.98]
    steps:
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [0.5, 0.0, -180.0]}
      - {type: mode, command: 匍匐模式, min_wait: 1.0}
      - {type: waypoint, target: [-4.0, 0.0, -180.0]}

  bunker:
    name: 沙坑
    calibrated: false
    origin: [-5.34, 3.94, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_bunker
      begin: [-5.34, -3.94]
      note: 第三次跳跃前保留3秒最短准备时间；移除了原数组越界。
    steps:
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [0.2, null, -180.0]}
      - {type: mode, command: 沙坑模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: waypoint, target: [-1.1, 0.04, 135.0]}
      - {type: mode, command: 沙坑模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: waypoint, target: [null, 1.25, 90.0]}
      - {type: mode, command: 沙坑模式, min_wait: 3.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}

  pole:
    name: 绕杆
    calibrated: false
    origin: [-6.995, 1.175, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_pole
      begin: [-6.995, -1.175]
    steps:
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [0.0, -0.4, 0.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [0.5, -0.5, 90.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [0.4, 0.7, 180.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [-0.5, 0.6, 90.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [-0.4, 1.6, 0.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [0.5, 1.5, -90.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [0.4, 0.5, 0.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [1.5, 0.6, 90.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [1.4, 1.5, 0.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [2.4, 1.4, -90.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [2.5, 0.5, 0.0], yaw_tolerance_deg: 7.0}
      - {type: waypoint, target: [3.5, 1.0, 0.0], yaw_tolerance_deg: 7.0}

  high_wall:
    name: 高墙
    calibrated: false
    origin: [-2.28, 0.06, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_hill_wall
      begin: [-2.28, -0.06]
    steps:
      - {type: mode, command: 木桥B模式, min_wait: 1.0}
      - {type: waypoint, target: [-0.2, null, 0.0]}
      - {type: mode, command: 高墙模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [1.0, null, 0.0]}

  step:
    name: 台阶
    calibrated: false
    origin: [0.0, 0.0, 0.0]
    source:
      file: task_to_do_unitree.py
      handler: handle_step
      begin: [0.0, 0.0]
      note: 原第二和第三航点混用了全局y；移植后null统一锁定障碍局部坐标。
    steps:
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [-0.15, 0.0, 0.0]}
      - {type: mode, command: 台阶模式, min_wait: 1.0}
      - {type: jump, command: 小跳1, min_wait: 5.0}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [0.32, null, null]}
      - {type: mode, command: 台阶模式, min_wait: 1.0}
      - {type: jump, command: 小跳2, min_wait: 5.0}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [0.62, null, null]}
      - {type: mode, command: 台阶模式, min_wait: 1.0}
      - {type: jump, command: 小跳2, min_wait: 5.0}
      - {type: mode, command: 正常模式, min_wait: 1.0}
      - {type: waypoint, target: [1.0, 0.0, 0.0]}
