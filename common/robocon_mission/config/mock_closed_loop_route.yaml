# Isolated Mock contract demonstration; these are NOT competition coordinates.
start_area: mock_origin
frame_id: map
route:
  - id: bridge_mock
    type: obstacle
    transit_pose: [0.2, 0.0, 0.0]
    approach_pose: [0.4, 0.0, 0.0]
    skill_id: mock_cross
    end_pose: [0.8, 0.0, 0.0]
    end_xy_tolerance: 0.15
    end_yaw_tolerance: 0.20
    transit_timeout: 3.0
    approach_timeout: 3.0
    skill_timeout: 3.0
    verify_timeout: 2.0
  - id: next_mock
    type: navigation
    pose: [1.0, 0.0, 0.0]
return:
  pose: [0.0, 0.0, 0.0]

