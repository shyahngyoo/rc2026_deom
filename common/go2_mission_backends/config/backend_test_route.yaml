# SIMULATION ONLY. Plant moves solely from the arbiter final output.
start_area: backend_sim_origin
frame_id: map
route:
  - id: obstacle_x
    type: obstacle
    transit_pose: [0.2, 0.0, 0.0]
    approach_pose: [0.3, 0.0, 0.0]
    skill_id: step_x
    end_pose: [0.5, 0.0, 0.0]
    end_xy_tolerance: 0.10
    end_yaw_tolerance: 0.10
    verify_timeout: 5.0
    transit_timeout: 12.0
    approach_timeout: 8.0
    skill_timeout: 8.0
    max_retries: 0
  - id: obstacle_y
    type: obstacle
    transit_pose: [0.7, 0.1, 1.5707963267948966]
    approach_pose: [0.7, 0.2, 1.5707963267948966]
    skill_id: step_y
    end_pose: [0.7, 0.4, 1.5707963267948966]
    end_xy_tolerance: 0.10
    end_yaw_tolerance: 0.10
    verify_timeout: 5.0
    transit_timeout: 12.0
    approach_timeout: 8.0
    skill_timeout: 8.0
    max_retries: 0
return:
  pose: [0.0, 0.0, 0.0]
